# Placeholder for auto-merge workflow for trivial changes labeled auto-merge
name: Auto Merge
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  pull-requests: write
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'auto-merge'
    steps:
      - uses: actions/checkout@v4
      - run: echo "Auto-merge triggered for trivial changes"
