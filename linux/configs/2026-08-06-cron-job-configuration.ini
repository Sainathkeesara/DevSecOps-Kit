[main]
# Linux cron job configuration for automated system maintenance tasks
# Runs daily at 2:30 AM to perform routine maintenance

[schedule]
minute=30
hour=2
day=*
month=*
weekday=*

[scripts]
# Log rotation — compress and rotate application logs older than 7 days
log_rotate=/usr/local/bin/rotate-logs.sh

# Temporary file cleanup — remove files in /tmp older than 3 days
temp_cleanup=/usr/local/bin/clean-tmp.sh

# Package index update — refresh apt cache for security patch readiness
pkg_update=/usr/local/bin/update-pkg-cache.sh

[notifications]
# Email address for cron job output and errors
email=admin@localhost

# Only send email if the job produces output or errors
mail_always=no