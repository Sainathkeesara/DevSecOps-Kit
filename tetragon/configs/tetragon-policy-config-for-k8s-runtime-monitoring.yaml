# last_verified: 2026-09-26 · tetragon n/a
#
# Tetragon runtime-monitoring policy for Kubernetes.
#
# This is the second policy shape I've applied after the narrow exec-and-file
# experiment at first-tracing-policy-exec-file.yaml. It widens the watch to the
# three signal categories a runtime-monitoring loop actually needs: process
# execution, file access, and network connections. It stays in observe mode
# (no enforcement) so it can run on a shared test cluster without disrupting
# workloads.
#
# Note on tracepoint shape: per the TracingPolicy CRD, a tracepoint entry is
# identified by `subsystem` + `event` (there is no `name:` field on a
# tracepoint spec). The earlier draft of this file used `name: exec`, which is
# not a valid tracepoint spec — the correct entry is `subsystem: syscalls` /
# `event: sys_enter`, filtered on argument 0 (the syscall ID).

apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: runtime-monitoring-observe
  annotations:
    tetragon.io/description: "Observe exec, file access, and network connects"
spec:
  tracepoints:
  - subsystem: "syscalls"
    event: "sys_enter"
    args:
    - index: 0
      type: "int64"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "59"  # __NR_execve — process execution
  kprobes:
  - call: "security_file_permission"
    syscall: false
    args:
    - index: 0
      type: "file"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "2"  # write permission (mode check for O_WRONLY/O_RDWR paths)