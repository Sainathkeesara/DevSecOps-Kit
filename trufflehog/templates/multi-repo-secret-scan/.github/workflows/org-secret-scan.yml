name: Organization Secret Scan

on:
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-repo-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TruffleHog
        run: |
          python -m pip install --upgrade pip
          python -m pip install trufflehog

      - name: Run multi-repo scan
        env:
          TRUFFLEHOG_TOKEN: ${{ secrets.TRUFFLEHOG_TOKEN }}
        run: |
          chmod +x scripts/scan-multi-repo.sh
          ./scripts/scan-multi-repo.sh

      - name: Generate summary report
        run: python3 scripts/generate-report.py

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: org-secret-scan-results
          path: reports/
          if-no-files-found: ignore

      - name: Fail on findings
        if: always()
        run: |
          if ls reports/*.json >/dev/null 2>&1; then
            TOTAL=$(find reports -name "*.json" -exec wc -l {} \; | awk '{sum+=$1} END {print sum}')
            if [[ "$TOTAL" -gt 0 ]]; then
              echo "::error::Secrets detected in organization repositories. See uploaded artifact."
              exit 1
            fi
          fi