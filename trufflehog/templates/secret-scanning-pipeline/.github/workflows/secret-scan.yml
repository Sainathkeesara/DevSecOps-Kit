name: TruffleHog Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50  # Scan recent history instead of entire tree

      - name: Install TruffleHog
        run: pip install trufflehog

      - name: Run TruffleHog scan
        run: |
          mkdir -p reports
          trufflehog filesystem \
            --config=trufflehog-config.yaml \
            --json \
            . 2>/dev/null > reports/results.json || true

      - name: Check for findings
        run: |
          if [ -s reports/results.json ]; then
            echo "Secrets detected:"
            jq -r '. | "\(.DetectorName) — \(.SourceMetadata.Data.Filesystem.file)"' \
              reports/results.json 2>/dev/null || cat reports/results.json
            exit 1
          fi
          echo "No secrets found."
