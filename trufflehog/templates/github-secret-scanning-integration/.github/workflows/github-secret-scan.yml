name: TruffleHog GitHub Secret Scan

on:
  pull_request:
  push:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pull-requests: write

jobs:
  trufflehog-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TruffleHog
        run: |
          python -m pip install --upgrade pip
          python -m pip install trufflehog

      - name: Run TruffleHog
        id: scan
        continue-on-error: true
        env:
          TRUFFLEHOG_TARGET_REPO: file://.
          TRUFFLEHOG_TOKEN: ${{ secrets.TRUFFLEHOG_TOKEN }}
        run: scripts/scan-github.sh

      - name: Upload TruffleHog results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-results
          path: |
            trufflehog-results.json
            trufflehog-summary.md
            trufflehog-scan.log
          if-no-files-found: ignore

      - name: Comment on pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultPath = 'trufflehog-results.json';
            if (!fs.existsSync(resultPath) || fs.statSync(resultPath).size === 0) {
              core.info('No TruffleHog findings to comment on.');
              return;
            }

            const summary = fs.readFileSync('trufflehog-summary.md', 'utf8');
            if (!context.payload.pull_request) {
              core.info('Skipping PR comment because this run is not associated with a pull request.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: summary
            });

      - name: Fail when TruffleHog finds secrets
        run: |
          if [ -s trufflehog-results.json ]; then
            echo "TruffleHog reported potential secrets. See the uploaded artifact and PR comment."
            exit 1
          fi
