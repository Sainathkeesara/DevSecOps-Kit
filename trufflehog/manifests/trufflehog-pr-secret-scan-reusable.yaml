name: TruffleHog PR secret scan (reusable)

on:
  workflow_call:
    inputs:
      scan-depth:
        description: Number of git commits to fetch. 0 fetches all history (default). Set to 1 for shallow PR checks.
        type: number
        required: false
        default: 0
      fail-on-verified:
        description: When true, the workflow fails only on verified secrets. When false, any finding fails the run.
        type: boolean
        required: false
        default: true
      results-path:
        description: Relative path to write the TruffleHog JSON results artifact.
        type: string
        required: false
        default: trufflehog-results.json
      config-path:
        description: Relative path to a TruffleHog YAML configuration file for custom detectors, allowlists, and entropy tuning.
        type: string
        required: false
        default: ""
      sarif-path:
        description: Relative path to write the SARIF output for GitHub Code Scanning upload.
        type: string
        required: false
        default: trufflehog-results.sarif
      exclude-globs:
        description: Comma-separated glob patterns to exclude from scanning (e.g. "*.test.js,*.snap").
        type: string
        required: false
        default: ""
    secrets:
      trufflehog-token:
        description: Optional TruffleHog API token for authenticated scan features (e.g. higher rate limits).
        required: false
    outputs:
      secrets-count:
        description: Total number of secrets detected during the scan.
        value: ${{ jobs.trufflehog-pr-scan.outputs.secrets-count }}

permissions:
  contents: read
  security-events: write

jobs:
  trufflehog-pr-scan:
    runs-on: ubuntu-latest
    outputs:
      secrets-count: ${{ steps.count.outputs.count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.scan-depth }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TruffleHog
        run: |
          python -m pip install --upgrade pip
          python -m pip install trufflehog

      - name: Run TruffleHog git scan
        id: scan
        continue-on-error: true
        env:
          TRUFFLEHOG_TOKEN: ${{ secrets.trufflehog-token || '' }}
        run: |
          CONFIG_ARG=""
          if [ -n "${{ inputs.config-path }}" ] && [ -f "${{ inputs.config-path }}" ]; then
            CONFIG_ARG="--config=${{ inputs.config-path }}"
          fi

          EXCLUDE_ARG=""
          if [ -n "${{ inputs.exclude-globs }}" ]; then
            EXCLUDE_ARG="--exclude-paths=${{ github.workspace }}/.trufflehogignore"
            printf '%s\n' ${{ inputs.exclude-globs }} | tr ',' '\n' > "${{ github.workspace }}/.trufflehogignore"
          fi

          trufflehog git "file://${{ github.workspace }}" \
            --json \
            $EXCLUDE_ARG \
            $CONFIG_ARG \
            --no-verification \
            > "${{ inputs.results-path }}"

      - name: Count findings
        id: count
        run: |
          if [ -f "${{ inputs.results-path }}" ]; then
            COUNT=$(wc -l < "${{ inputs.results-path }}" | tr -d ' ')
          else
            COUNT=0
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Secrets found: $COUNT"

      - name: Convert to SARIF
        id: sarif
        if: steps.count.outputs.count != '0'
        run: |
          cat > /tmp/to-sarif.py << 'PYEOF'
          import json, sys

          SARIF_TEMPLATE = {
              "version": "2.1.0",
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/openc2-json-schema/master/schemas/sarif/sarif-v2.1.0.json",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "TruffleHog",
                          "informationUri": "https://github.com/trufflesecurity/trufflehog"
                      }
                  },
                  "results": [],
                  "columnKind": "unicodeCodePoints"
              }]
          }

          try:
              with open("${{ inputs.results-path }}") as f:
                  findings = [json.loads(line) for line in f if line.strip()]
          except (FileNotFoundError, json.JSONDecodeError):
              findings = []

          severity_map = {
              "critical": "error",
              "high": "error",
              "medium": "warning",
              "low": "note"
          }

          for finding in findings:
              level = severity_map.get(finding.get("Severity", {}).get("Score", ""), "warning")
              SARIF_TEMPLATE["runs"][0]["results"].append({
                  "message": {
                      "text": f"Secret detected by {finding.get('DetectorName', 'unknown')} — {finding.get('Description', 'No description')}"
                  },
                  "level": level,
                  "locations": [{
                      "physicalLocation": {
                          "artifactLocation": {
                              "uri": finding.get("SourceMetadata", {}).get("Data", {}).get("Git", {}).get("file", "")
                          },
                          "region": {
                              "startLine": finding.get("SourceMetadata", {}).get("Data", {}).get("Git", {}).get("line", 0)
                          }
                  }}],
                  "properties": {
                      "verified": finding.get("Verified", False),
                      "detector": finding.get("DetectorName", ""),
                      "raw": finding.get("Raw", "")[:80]
                  }
              })

          with open("${{ inputs.sarif-path }}", "w") as out:
              json.dump(SARIF_TEMPLATE, out, indent=2)
          PYEOF
          python3 /tmp/to-sarif.py

      - name: Upload SARIF to GitHub Code Scanning
        if: steps.sarif.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ inputs.sarif-path }}
          category: trufflehog

      - name: Upload JSON results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-results-json
          path: ${{ inputs.results-path }}
          if-no-files-found: ignore

      - name: Fail on findings
        if: steps.count.outputs.count != '0'
        run: |
          if [ "${{ inputs.fail-on-verified }}" == "true" ]; then
            jq -c 'select(.Verified == true)' "${{ inputs.results-path }}" > /tmp/verified.json
            if [ -s /tmp/verified.json ]; then
              echo "::error::Verified secrets detected — failing the workflow"
              exit 1
            fi
          else
            echo "::error::TruffleHog detected ${{ steps.count.outputs.count }} potential secrets — failing the workflow"
            exit 1
          fi
