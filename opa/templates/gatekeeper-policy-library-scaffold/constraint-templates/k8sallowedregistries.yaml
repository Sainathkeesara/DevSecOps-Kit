# last_verified: 2026-08-27 · OPA Gatekeeper

apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8sallowedregistries
spec:
  crd:
    spec:
      names:
        kind: K8sAllowedRegistries
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8s.allowed_registries

        # Default allowed registries -- override via Constraint parameters
        default allowed = ["docker.io", "gcr.io", "quay.io"]

        # Merge user-supplied list with defaults
        allowed_registries := input.parameters.allowedRegistries {
          input.parameters.allowedRegistries
        } else := allowed

        # Extract registry domain from an image reference
        registry(img) = r {
          parts := split(img, "/")
          r := parts[0]
        }

        # Deny images from unapproved registries
        deny[msg] {
          container := input.review.object.spec.containers[_]
          img := container.image
          reg := registry(img)
          not reg == allowed_registries[_]
          msg := sprintf("Image %v uses unapproved registry %v", [img, reg])
        }
