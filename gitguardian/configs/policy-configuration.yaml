# last_verified: 2026-10-03 · gitguardian n/a
# Purpose: Org-level GitGuardian secret-scanning policy template. One file that
#   records which detectors are enforced, which paths are ignored (and why), and
#   what fields an incident handoff must carry.
# When to use: as the starting point for a new repo or monorepo team that needs
#   a reviewable policy before wiring CI scans. Copy this file to the repo root
#   next to the scan config and narrow every section to that repo.
# Prerequisites: ggshield available to the team; a scoped API token stored as a
#   CI secret; branch protection able to require the scan job on pull requests.
# Steps: 1) set policy.name/scope; 2) keep detectors enforced unless a stated
#   reason exists; 3) scope each ignore to the narrowest path plus a reason;
#   4) fill ownership so every path has an owner; 5) fill incident-handoff so a
#   confirmed leak is revoked and rotated, not just closed.
# Verify: run a diff-scoped scan on a pull request and a full-path scan on a
#   schedule; confirm fixture paths stay quiet while a canary secret outside
#   those paths still blocks. See gitguardian/docs/cicd-secret-scanning-integration.md.
# Common errors: ignoring a whole secret type instead of a path; an ignore entry
#   without an expiry/review date that silently becomes permanent; ownership
#   with a directory gap so a finding has no router. See also
#   gitguardian/configs/monorepo-allowlists.yaml for the monorepo allowlist shape
#   and gitguardian/scripts/gg-incident-response-pipeline.sh for finding routing.
#
# Org policy metadata (not consumed by ggshield; recorded here for humans):
#   policy.name: "org-default-secret-policy"
#   policy.scope: "Per-repo copy; org baseline lives in version control, teams narrow it."
#   policy.review_cadence: "Quarterly; every ignored_matches entry carries reviewed_on below."
#   ownership:
#     - prefix: "services/payments/"
#       owner: "payments-team"
#     - prefix: "infra/"
#       owner: "platform-team"
#     - prefix: "/"
#       owner: "security-oncall"
#   incident-handoff.required_fields:
#     - "secret_path"
#     - "commit_sha"
#     - "detector"
#     - "owner"
#     - "rotation_status"
#   ci-gate.pull_request_scan: "block"
#   ci-gate.scheduled_scan: "report"
#   ci-gate.merge_rule: "Scan job is a required status check; findings must be resolved or explicitly ignored before merge."

version: 2

secret:
  # Detectors stay enforced by default. Only list a slug here when the team has a
  # documented reason, and record that reason. Find the exact slug in the scan
  # output for this repo rather than copying one from another repo's config.
  ignored_detectors: []

  # Generated, vendored, and build-output paths that should never be scanned.
  # Keep this list short; anything source-like belongs under ignored_matches
  # with a reason.
  ignored_paths:
    - "node_modules/"
    - "vendor/"
    - "dist/"
    - "build/"

  # Narrowly scoped path ignores. Each entry needs a reason and a review date so
  # it cannot silently become a permanent blind spot.
  ignored_matches:
    - name: "minified js"
      match: "*.min.js"
      reason: "Build output checked in for serving; source maps stay scanned."
      reviewed_on: "2026-10-03"
    - name: "generated go"
      match: "*.generated.go"
      reason: "Code-generated; inputs are scanned at the generator templates."
      reviewed_on: "2026-10-03"
