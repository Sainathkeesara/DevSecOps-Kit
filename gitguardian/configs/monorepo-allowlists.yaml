version: 2

secret:
  ignored_paths:
    - "node_modules/"
    - "vendor/"
    - "dist/"
    - "build/"
    - ".terraform/"
  ignored_detectors:
    - "generic_api_key"
  ignored_matches:
    - name: "generated go"
      match: "*.generated.go"
    - name: "minified js"
      match: "*.min.js"
    - name: "frontend generated"
      match: "frontend/src/generated/**"
    - name: "backend vendor"
      match: "backend/vendor/**"
    - name: "terraform cache"
      match: "infra/terraform/.terraform/**"
ENDOFFILE