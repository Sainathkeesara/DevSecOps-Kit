# last_verified: 2026-08-19 · GitGuardian ggshield

name: Organization secret scan

on:
  schedule:
    - cron: '0 2 * * 1'   # Weekly Monday 02:00 UTC
  workflow_dispatch:

jobs:
  org-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GG_CONFIG: ${{ github.workspace }}/ggshield.yaml
    steps:
      - name: Checkout scaffold
        uses: actions/checkout@v4

      - name: Install ggshield
        run: pip install ggshield

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run multi-repo scan
        env:
          GG_TOKEN: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          bash scripts/scan-multi-repo.sh repos.txt reports

      - name: Aggregate report
        run: |
          bash scripts/aggregate-report.sh reports > reports/summary.json

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-reports
          path: reports/
          retention-days: 14
