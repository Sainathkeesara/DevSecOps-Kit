---
metadata:
  id: CKV_DRIFT_SG_005
  name: "Detect egress rules allowing all traffic to 0.0.0.0/0"
  category: "DRIFT"
  severity: MEDIUM
scope:
  provider: aws
definition:
  cond_type: attribute
  resource_types:
    - aws_security_group
    - aws_security_group_rule
  attribute: egress
  operator: contains
  value:
    cidr_blocks:
      - "0.0.0.0/0"
    from_port: 0
    to_port: 0
    protocol: "-1"