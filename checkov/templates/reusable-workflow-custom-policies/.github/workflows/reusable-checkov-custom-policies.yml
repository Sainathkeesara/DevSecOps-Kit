name: Reusable Checkov workflow — custom policies

on:
  workflow_call:
    inputs:
      scan-directory:
        description: Root directory to scan recursively
        type: string
        default: .
      frameworks:
        description: Comma-separated IaC frameworks to check
        type: string
        default: terraform,kubernetes,dockerfile
      custom-policy-dir:
        description: Path to directory containing Checkov custom policy YAML files
        type: string
        default: custom-policies
      severity-threshold:
        description: Fail the workflow if any finding at or above this severity
        type: string
        default: HIGH
      output-sarif:
        description: Generate SARIF output and upload to GitHub Code Scanning
        type: boolean
        default: true
      upload-artifact:
        description: Upload scan results as a workflow artifact
        type: boolean
        default: false

    secrets:
      checkov-license:
        description: Checkov license key for premium features
        required: false

    outputs:
      sarif-upload-id:
        description: Category identifier passed to the SARIF upload action
        value: checkov-custom-policies
      exit-code:
        description: Exit code from the Checkov scan step
        value: ${{ jobs.scan.outputs.exit-code }}

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Checkov scan with custom policies
    runs-on: ubuntu-latest
    outputs:
      exit-code: ${{ steps.checkov-scan.outputs.exit-code }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: |
          pip install checkov

      - name: Validate custom policy directory
        id: validate-policies
        run: |
          if [ -n "${{ inputs.custom-policy-dir }}" ] && [ -d "${{ inputs.custom-policy-dir }}" ]; then
            COUNT=$(find "${{ inputs.custom-policy-dir }}" -name '*.yaml' | wc -l)
            echo "Found $COUNT custom policy file(s) in ${{ inputs.custom-policy-dir }}"
            echo "policy-count=$COUNT" >> "$GITHUB_OUTPUT"
          else
            echo "No custom policy directory found — proceeding with built-in checks only"
            echo "policy-count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Checkov scan
        id: checkov-scan
        continue-on-error: true
        run: |
          mkdir -p results

          ARGS=(
            --directory "${{ inputs.scan-directory }}"
            --framework "${{ inputs.frameworks }}"
            --quiet
            --compact
          )

          if [ -n "${{ inputs.custom-policy-dir }}" ] && [ -d "${{ inputs.custom-policy-dir }}" ]; then
            ARGS+=(--external-checks-dir "${{ inputs.custom-policy-dir }}")
          fi

          if [ "${{ inputs.output-sarif }}" == "true" ]; then
            ARGS+=(--output sarif)
            checkov "${ARGS[@]}" > results/checkov-results.sarif 2>&1
          else
            ARGS+=(--output cli)
            checkov "${ARGS[@]}" 2>&1 | tee results/checkov-results.txt
          fi

          RC=$?
          echo "exit-code=$RC" >> "$GITHUB_OUTPUT"
          echo "Checkov exit code: $RC"

      - name: Upload SARIF to GitHub Code Scanning
        if: inputs.output-sarif == true && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results/checkov-results.sarif
          category: checkov-custom-policies

      - name: Upload scan artifact
        if: inputs.upload-artifact == true && always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: results/

      - name: Fail on severity threshold breach
        if: steps.checkov-scan.outputs.exit-code != '0'
        run: |
          echo "Checkov found issues at or above severity ${{ inputs.severity-threshold }}."
          echo "Review the SARIF output or workflow logs for details."
          exit 1
