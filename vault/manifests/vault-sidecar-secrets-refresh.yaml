# last_verified: 2026-09-15 · Vault n/a
# Vault Agent sidecar injection for secret refresh without pod restarts.
# The injector webhook adds a Vault Agent sidecar that renders the secret to
# a shared volume and re-renders the file when the source secret changes, so
# the app container sees updated values without a redeploy. The app itself
# must re-read the file (or watch it for changes) — nothing here restarts
# the pod. Pair with a Kubernetes auth role (bound to this ServiceAccount)
# that grants read on secret/data/my-app/*.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-app
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: default
  labels:
    app: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "my-app-role"
        vault.hashicorp.com/agent-inject-secret-app-config: "secret/data/my-app/config"
        vault.hashicorp.com/agent-inject-template-app-config: |
          {{- with secret "secret/data/my-app/config" -}}
          DB_PASSWORD={{ .Data.data.db_password }}
          API_KEY={{ .Data.data.api_key }}
          {{- end }}
    spec:
      serviceAccountName: my-app
      containers:
        - name: app
          image: my-app:latest
          ports:
            - containerPort: 8080
          # The injector creates the shared vault-secrets volume; the app
          # only needs the mount. Re-read /vault/secrets/app-config on
          # change instead of restarting the pod.
          volumeMounts:
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
