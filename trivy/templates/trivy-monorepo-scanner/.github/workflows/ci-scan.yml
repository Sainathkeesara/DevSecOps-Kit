name: Trivy Monorepo Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results/fs.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Image scan (build and scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          image-ref: "service-a:ci"
          dockerfile: "services/service-a/Dockerfile"
          format: "sarif"
          output: "trivy-results/images.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results"
          category: "trivy"
