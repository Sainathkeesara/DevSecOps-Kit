# Trivy Operator — Kubernetes-native vulnerability scanning
# Deploys the operator controller + node collector for
# automatic image scanning across the cluster.
#
# Apply: kubectl apply -f trivy-operator-deployment.yaml
# Verify: kubectl get vulnerabilityreports -A

---
apiVersion: v1
kind: Namespace
metadata:
  name: trivy-system
  labels:
    app.kubernetes.io/name: trivy-operator
    app.kubernetes.io/component: operator

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trivy-operator
  namespace: trivy-system
  labels:
    app.kubernetes.io/name: trivy-operator

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trivy-operator
  labels:
    app.kubernetes.io/name: trivy-operator
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "nodes", "replicationcontrollers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces", "configmaps", "secrets", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["aquasecurity.github.io"]
    resources:
      - "vulnerabilityreports"
      - "configauditreports"
      - "clusterconfigauditreports"
      - "sbomreports"
      - "clustersbomreports"
      - "exposedsecretreports"
      - "clustervulnerabilityreports"
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trivy-operator
  labels:
    app.kubernetes.io/name: trivy-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trivy-operator
subjects:
  - kind: ServiceAccount
    name: trivy-operator
    namespace: trivy-system

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-operator-config
  namespace: trivy-system
  labels:
    app.kubernetes.io/name: trivy-operator
data:
  trivy-operator.env: |
    OPERATOR_TARGET_NAMESPACES=
    OPERATOR_SCAN_JOB_RETRY_AFTER_MINUTES=5
    OPERATOR_SCAN_JOB_TIMEOUT=5m
    OPERATOR_VULNERABILITY_SCANNER_ENABLED=true
    OPERATOR_CONFIG_AUDIT_SCANNER_ENABLED=true
    OPERATOR_EXPOSED_SECRET_SCANNER_ENABLED=true
    OPERATOR_SCANNER_REPORT_TTL=24h
  trivy.env: |
    TRIVY_SEVERITY=CRITICAL,HIGH
    TRIVY_IGNORE_UNFIXED=false
    TRIVY_SKIP_FILES=".*node_modules.*"
    TRIVY_DB_REPOSITORY=ghcr.io/aquasecurity/trivy-db:2
    TRIVY_TIMEOUT=5m0s
    TRIVY_CACHE_DIR=/home/scanner/.cache/trivy
  node-collector.env: |
    NODE_COLLECTOR_SCAN_INTERVAL=12h

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trivy-operator
  namespace: trivy-system
  labels:
    app.kubernetes.io/name: trivy-operator
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trivy-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trivy-operator
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: trivy-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/aquasecurity/trivy-operator:0.23.1
          imagePullPolicy: IfNotPresent
          args:
            - --config-dir=/etc/trivy-operator
          envFrom:
            - configMapRef:
                name: trivy-operator-config
                optional: true
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      nodeSelector:
        kubernetes.io/os: linux

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: trivy-node-collector
  namespace: trivy-system
  labels:
    app.kubernetes.io/name: trivy-operator
    app.kubernetes.io/component: node-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: trivy-operator
      app.kubernetes.io/component: node-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trivy-operator
        app.kubernetes.io/component: node-collector
    spec:
      serviceAccountName: trivy-operator
      hostPID: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node-collector
          image: ghcr.io/aquasecurity/node-collector:0.2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          env:
            - name: NODE_COLLECTOR_SCAN_INTERVAL
              value: "12h"
            - name: NODE_COLLECTOR_OUTPUT_DIR
              value: "/var/lib/trivy-operator/node-collector"
          volumeMounts:
            - name: host-fs
              mountPath: /host
              readOnly: true
            - name: output-dir
              mountPath: /var/lib/trivy-operator/node-collector
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: host-fs
          hostPath:
            path: /
            type: Directory
        - name: output-dir
          hostPath:
            path: /var/lib/trivy-operator/node-collector
            type: DirectoryOrCreate
      nodeSelector:
        kubernetes.io/os: linux

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-operator-policies
  namespace: trivy-system
  labels:
    app.kubernetes.io/name: trivy-operator
data:
  # Severity thresholds for automated gating
  policy.json: |
    {
      "vulnerability": {
        "critical": { "action": "block", "max_allowed": 0 },
        "high": { "action": "warn", "max_allowed": 5 },
        "medium": { "action": "ignore", "max_allowed": -1 },
        "low": { "action": "ignore", "max_allowed": -1 }
      },
      "config_audit": {
        "critical": { "action": "block", "max_allowed": 0 },
        "high": { "action": "block", "max_allowed": 2 }
      }
    }
