# Full scan: spider + AJAX spider + active scan
# Detects SQL injection, cross-site scripting, and other active vulnerabilities.
# Takes longer than the quick plan; use for scheduled or release gates.
env:
  contexts:
    - name: full-target
      urls:
        - "{{TARGET_URL}}"
      includePaths:
        - ".*"
      excludePaths:
        - ".*\\.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)(\\?.*)?$"
jobs:
  - type: spider
    parameters:
      context: full-target
      maxDuration: 3
      subtreeOnly: false

  - type: spiderAjax
    parameters:
      context: full-target
      maxDuration: 5
      numberOfBrowsers: 1

  - type: passiveScan
    parameters:
      maxAlertsPerRule: 10

  - type: activeScan
    parameters:
      context: full-target
      maxDuration: 20
      threadPerHost: 4
      alertThreshold: MEDIUM

  - type: report
    parameters:
      format: json
      reportDir: /zap/reports
      reportFileName: "zap-full-report-{{DATE:yyyyMMdd-HHmmss}}.json"
      reportTitle: "Full DAST Scan — {{TARGET_URL}}"
      display: false
