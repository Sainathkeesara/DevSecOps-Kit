name: ZAP DAST Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL to scan"
        required: true
        type: string

jobs:
  zap-dast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ZAP Automation Framework scan
        run: |
          mkdir -p zap-report
          docker run --rm \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -autorun /zap/wrk/zap-automation-plan.yaml \
            -job TARGET_URL "${{ github.event.inputs.target_url || vars.TARGET_URL }}" \
            -job REPORT_DIR "/zap/wrk/zap-report"
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || vars.TARGET_URL }}

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap-report/

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: zap-report/zap-results.sarif
