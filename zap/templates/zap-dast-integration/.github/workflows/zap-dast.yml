name: ZAP DAST Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: "0 2 * * 1"  # Weekly Monday 02:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  dast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set target URL
        id: target
        run: |
          if [[ -n "${{ vars.TARGET_URL }}" ]]; then
            echo "url=${{ vars.TARGET_URL }}" >> $GITHUB_OUTPUT
          else
            echo "url=http://localhost:8080" >> $GITHUB_OUTPUT
          fi

      - name: Run ZAP quick scan
        run: |
          mkdir -p zap-results
          docker run --rm -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -autorun /zap/wrk/zap-automation-plan.yaml \
            -job TARGET_URL "${{ steps.target.outputs.url }}" \
            -job REPORT_DIR "/zap/wrk/zap-results"

      - name: Convert ZAP JSON to SARIF
        run: |
          REPORT=$(ls -t zap-results/*.json 2>/dev/null | head -1)
          if [[ -n "$REPORT" ]]; then
            echo "Converting $REPORT to SARIF..."
            jq -s '
              {
                version: "2.1.0",
                runs: [{
                  tool: { driver: { name: "OWASP ZAP", informationUri: "https://www.zaproxy.org" } },
                  results: [.[] | .alerts[]? // .[]? | {
                    ruleId: .pluginId // "unknown",
                    message: { text: .name // "Alert" },
                    level: (if .risk == "High" then "error" elif .risk == "Medium" then "warning" elif .risk == "Low" then "note" else "none" end),
                    locations: [{ physicalLocation: { artifactLocation: { uri: .url // .attack // "unknown" } } }]
                  }]
                }]
              }
            ' "$REPORT" > zap-results/zap-results.sarif
          fi

      - name: Upload ZAP report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap-results/
          retention-days: 30

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: zap-results/zap-results.sarif