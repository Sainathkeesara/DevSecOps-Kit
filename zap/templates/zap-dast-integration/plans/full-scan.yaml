# last_verified: 2026-07-05 · zap stable
# Purpose: ZAP Automation Framework full scan plan
# Takes longer (~10-20 min) but catches OWASP Top 10 vulnerabilities
env:
  contexts:
    - name: zap-target
      urls:
        - "{{TARGET_URL}}"
      includePaths:
        - ".*"
      excludePaths:
        - ".*\\.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)(\\?.*)?$"

jobs:
  - type: spider
    parameters:
      context: zap-target
      maxDuration: 3

  - type: spiderAjax
    parameters:
      context: zap-target
      maxDuration: 5
      numberOfBrowsers: 1

  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10

  - type: activeScan
    parameters:
      context: zap-target
      maxDuration: 20
      threadPerHost: 4
      alertThreshold: MEDIUM
    tests:
      - type: alertCount
        onFail: INFO
        action: raise_alerts
        risk: HIGH
        count: 0
        operator: "=="

  - type: report
    parameters:
      template: traditional-json-plus
      reportDir: "{{REPORT_DIR}}"
      reportFileName: "zap-full-report-{{DATE:yyyyMMdd-HHmmss}}.json"
      reportTitle: "Full DAST Scan"