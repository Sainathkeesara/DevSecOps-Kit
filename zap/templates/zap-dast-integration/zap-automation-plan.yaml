# last_verified: 2026-07-05 · zap stable
# Purpose: ZAP Automation Framework plan for CI-integrated DAST scanning
# Runs spider crawl, passive scan, AJAX spider, active scan, and exports JSON/SARIF.
# Intended for headless CI execution via: zap.sh -cmd -autorun zap-automation-plan.yaml
---
env:
  contexts:
    - name: ci-target
      urls:
        - "{{TARGET_URL}}"
      includePaths:
        - ".*"
      excludePaths:
        - ".*\\.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)(\\?.*)?$"

jobs:
  - type: spider
    parameters:
      context: ci-target
      maxChildren: 10
      maxDepth: 5
      maxDuration: 2
    tests:
      - type: spiderStats
        onFail: WARN
        statistic: urls_added
        value: 1
        operator: ">="

  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10
      passiveScanThreads: 4

  - type: spiderAjax
    parameters:
      context: ci-target
      maxDuration: 5
      maxCrawlDepth: 5
      numberOfBrowsers: 1
    tests:
      - type: spiderAjaxStats
        onFail: WARN
        statistic: urls_added
        value: 1
        operator: ">="

  - type: activeScan
    parameters:
      context: ci-target
      maxDuration: 20
      maxScansInUI: 5
      threadPerHost: 4
      alertThreshold: MEDIUM
    policyDefinition:
      rules:
        - id: 40012
          threshold: MEDIUM
          strength: DEFAULT
        - id: 40018
          threshold: MEDIUM
          strength: DEFAULT
        - id: 90019
          threshold: MEDIUM
          strength: DEFAULT
        - id: 40014
          threshold: MEDIUM
          strength: DEFAULT
        - id: 40024
          threshold: MEDIUM
          strength: DEFAULT
    tests:
      - type: alertCount
        onFail: INFO
        action: raise_alerts
        risk: HIGH
        count: 0
        operator: "=="

  - type: report
    parameters:
      template: traditional-json-plus
      reportDir: "{{REPORT_DIR}}"
      reportFileName: "zap-report-{{DATE:yyyyMMdd-HHmmss}}.json"
      reportTitle: "CI DAST Scan — {{TARGET_URL}}"
      display: false
