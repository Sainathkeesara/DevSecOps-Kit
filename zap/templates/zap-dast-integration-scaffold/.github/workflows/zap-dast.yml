name: ZAP DAST Scan

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC

jobs:
  dast-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ZAP DAST scan
        run: |
          chmod +x scripts/run-zap-dast.sh
          ./scripts/run-zap-dast.sh "${{ vars.ZAP_TARGET_URL || 'http://localhost:8080' }}" \
            reports

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: reports/
          retention-days: 30
