# last_verified: 2026-07-05 · zap stable
# Purpose: GitHub Actions workflow for ZAP DAST scanning with Automation Framework
name: ZAP DAST Scan

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dast-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set target URL
        id: target
        run: |
          if [[ -n "${{ vars.ZAP_TARGET_URL }}" ]]; then
            echo "url=${{ vars.ZAP_TARGET_URL }}" >> $GITHUB_OUTPUT
          else
            echo "url=http://localhost:8080" >> $GITHUB_OUTPUT
          fi

      - name: Run ZAP DAST scan
        run: |
          mkdir -p reports
          docker run --rm -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -autorun /zap/wrk/zap-automation-plan.yaml \
            -job TARGET_URL "${{ steps.target.outputs.url }}" \
            -job REPORT_DIR "/zap/wrk/reports"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: reports/
          retention-days: 30
