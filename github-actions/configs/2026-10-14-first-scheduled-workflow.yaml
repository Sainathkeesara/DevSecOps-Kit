# last_verified: 2026-10-14 · GitHub Actions n/a
# My first scheduled workflow — a cron entry fires it with no push from me.
# TODO: not sure whether scheduled runs only fire from the default branch yet.
name: first-scheduled
on:
  schedule:
    - cron: "17 6 * * 1"   # 06:17 UTC every Monday
  workflow_dispatch:      # so I can re-run it by hand while I tweak the cron
jobs:
  weekly-check:
    runs-on: ubuntu-latest
    steps:
      - run: echo "scheduled run at $(date -u)"
