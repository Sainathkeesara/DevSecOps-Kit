# last_verified: 2026-11-03 · GitHub Actions n/a
# CI for the sample app: builds and tests on every pull request,
# and pushes the image to the registry on a green merge to master.

name: CI — sample app

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest
      - name: Build the sample app image
        run: docker build -t sample-app:${{ github.sha }} .

  push-to-registry:
    name: Push image to registry
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/sample-app:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository_owner }}/sample-app:${{ github.sha }}