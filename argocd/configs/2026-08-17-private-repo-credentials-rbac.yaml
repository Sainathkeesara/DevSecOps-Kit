# last_verified: 2026-08-17 · ArgoCD 3.5.1
# Config for pulling from a private Git repo: repository credentials as a
# Kubernetes Secret + RBAC that decides who may touch those apps.
#
# Two files under one topic here (separated by ---). Lesson learned while
# wiring this up: ArgoCD does not need `argocd repo add` at all if you drop a
# labelled Secret into its namespace — the argocd-server picks it up and treats
# the URL as a known repo. Declarative beats clicky every time.

# 1) Repository credentials.
# The `argocd.argoproj.io/secret-type: repository` label is the marker ArgoCD
# looks for. Without it the Secret is ignored completely — it just sits there.
apiVersion: v1
kind: Secret
metadata:
  name: private-apps-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/<your-org>/<private-app>.git
  username: gitops-bot
  password: <personal-access-token>
# Using stringData so I write the token in plain text and the API base64-encodes
# it for me. It is still just base64 at rest — ArgoCD encrypts nothing, so the
# Secret itself must stay out of Git for anything important.

---
# 2) RBAC for who can read / sync apps tied to that private repo.
# First-match-wins policy: `p` lines grant a subject a resource+action on an
# object, `g` lines bind a user to a role. Built-in roles like `role:admin` and
# `role:readonly` exist, but I want a named role scoped to the acme project only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
data:
  policy.default: role:readonly
  policy.csv: |
    p, role:acme-gitops, applications, *, acme/*, allow
    p, role:acme-gitops, repositories, get, *, allow
    g, alice@example.com, role:acme-gitops
# `acme/*` = project name slash anything, so this role cannot see apps outside
# the acme project even though policy.default grants readonly everywhere.