name: Sign container image with Cosign (keyless)

# This workflow signs a container image pushed from the same workflow run
# using Cosign's keyless (OIDC) mode — no private key to manage.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      # installing cosign via installer so I don’t pin a binary version by hand.
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: v2.2.4

      # keyless signing — cosign detects the GitHub OIDC token automatically
      # because the job has `id-token: write` via the top-level permissions block.
      - name: Sign image with Cosign (keyless)
        env:
          TUF_ROOT: /tmp/cosign
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}:${{ github.sha }}
          # `--yes` skips the interactive confirmation prompt in CI

      - name: Verify signature (sanity check within same workflow)
        env:
          TUF_ROOT: /tmp/cosign
        run: |
          echo "Attestation verification — substitute your own trusted identities."
          # In a real pipeline you would also verify the OIDC issuer here:
          # cosign verify --certificate-identity="${{ github.repository_owner }}" \
          #   --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
          #   ghcr.io/${{ github.repository }}:${{ github.sha }}