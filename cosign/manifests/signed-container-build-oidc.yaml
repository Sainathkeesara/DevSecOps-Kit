# last_verified: 2026-08-20 · cosign n/a
# Cosign signed container build workflow with OIDC
# Reusable workflow: builds a container image, signs it with cosign
# using keyless OIDC, and pushes the signed image to a registry.
name: Signed container build

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      context:
        required: false
        type: string
        default: .
      tags:
        required: false
        type: string
        default: ${{ github.sha }},latest

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        run: |
          IMAGE_ID="ghcr.io/${{ inputs.image-name }}"
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')
          docker build -t "$IMAGE_ID" -f "${{ inputs.dockerfile }}" "${{ inputs.context }}"
          for tag in $(echo "${{ inputs.tags }}" | tr ',' ' '); do
            docker tag "$IMAGE_ID" "$IMAGE_ID:$tag"
            docker push "$IMAGE_ID:$tag"
          done
          echo "IMAGE=$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Sign the image with Cosign
        run: |
          cosign sign "${{ env.IMAGE }}" --yes
