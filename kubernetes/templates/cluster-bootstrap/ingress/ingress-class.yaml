# last_verified: 2026-10-28 · kubernetes n/a
# Cluster bootstrap — Ingress.
# Install an ingress controller (e.g. ingress-nginx) first, then create the IngressClass
# that tells the cluster which controller handles Ingress objects, plus a sample Ingress.
#
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
  labels:
    bootstrap-component: ingress
spec:
  controller: ingress-nginx.controller
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-app
  labels:
    bootstrap-component: ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sample-app
                port:
                  number: 80
