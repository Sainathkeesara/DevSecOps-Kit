# last_verified: 2026-07-15 · kubectl n/a
# My very first workload on a cluster: one nginx pod fronted by a Service.
# Apply with: kubectl apply -f first-pod-service.yaml
apiVersion: v1
kind: Pod
metadata:
  name: hello-pod
  labels:
    app: hello
spec:
  containers:
    - name: hello
      image: nginx:1.29
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello-svc
spec:
  selector:
    app: hello
  ports:
    - port: 80
      targetPort: 80
