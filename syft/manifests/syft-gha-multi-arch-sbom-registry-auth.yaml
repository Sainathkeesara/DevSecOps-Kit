# last_verified: 2026-08-01 · syft n/a
name: Syft Multi-Arch SBOM with Registry Auth

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_ref:
        description: Image reference to scan (e.g. registry.example.com/app:v1.2.3)
        required: true
        default: ''

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up QEMU for cross-architecture support
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull platform-specific image
        run: |
          IMAGE="${{ github.event.inputs.image_ref || secrets.IMAGE_REF }}"
          docker pull --platform linux/${{ matrix.arch }} "${IMAGE}"

      - name: Generate SBOM with Syft
        id: syft
        run: |
          IMAGE="${{ github.event.inputs.image_ref || secrets.IMAGE_REF }}"
          mkdir -p reports
          syft "docker://${IMAGE}" \
            --platform "linux/${{ matrix.arch }}" \
            --output cyclonedx-json \
            > "reports/sbom-${{ matrix.arch }}.cdx.json"
          syft "docker://${IMAGE}" \
            --platform "linux/${{ matrix.arch }}" \
            --output spdx-json \
            > "reports/sbom-${{ matrix.arch }}.spdx.json"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.arch }}
          path: |
            reports/sbom-${{ matrix.arch }}.cdx.json
            reports/sbom-${{ matrix.arch }}.spdx.json
          retention-days: 30

  verify-sbom:
    runs-on: ubuntu-latest
    needs: generate-sbom
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          name: sbom-*
          path: reports/

      - name: Validate SBOM files
        run: |
          for f in reports/**/*.cdx.json reports/**/*.spdx.json; do
            if [ -f "$f" ]; then
              python3 -c "import json; json.load(open('$f'))" \
                && echo "Valid JSON: $f" \
                || { echo "Invalid JSON: $f"; exit 1; }
            fi
          done

      - name: Check SBOM is non-empty
        run: |
          TOTAL=$(find reports/ -name '*.cdx.json' -o -name '*.spdx.json' | wc -l)
          if [ "$TOTAL" -eq 0 ]; then
            echo "No SBOM files found"
            exit 1
          fi
          echo "Generated $TOTAL SBOM file(s)"