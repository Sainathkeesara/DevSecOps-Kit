# Syft configuration — cataloger and output preferences
#
# Reference: https://github.com/anchore/syft#configuration

# Cataloger selection — enable only the package types relevant to the scan
catalogers:
  # Language-specific ecosystems
  - python-package
  - javascript-package
  - ruby-gemfile
  - java-pom
  - java-gradle
  - go-module
  - rust-cargo
  # OS-level package DBs
  - dpkg
  - rpm
  - apk
  # Container metadata
  - port

# Exclude file paths / globs from scanning
exclude:
  - "**/node_modules/**"
  - "**/__pycache__/**"
  - "**/.git/**"

# Output preferences
output:
  - cyclonedx-json
  - spdx-json

# File output (writes to <image>-<format>.<ext> by default)
file: "syft-output"

# Quiet mode reduces progress output
quiet: true
