# last_verified: 2026-11-14 · kustomize n/a
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  labels:
    app: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
      - name: app
        image: sample-app:dev
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
