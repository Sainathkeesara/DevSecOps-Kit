# last_verified: 2026-10-15 · ansible 2.15+
---
# Staging inventory — generated from Terraform outputs or edited manually
# Host IPs/DNS should be populated by your CI/CD pipeline after Terraform apply
# See ansible-013 for the inventory generator script

all:
  children:
    # Control plane / management hosts
    bastion:
      hosts:
        # bastion-staging:
        #   ansible_host: 10.0.1.10
        #   ansible_user: admin
      vars:
        ansible_ssh_common_args: "-o ProxyCommand='ssh -W %h:%p -q admin@bastion-staging'"

    # Application tier
    webservers:
      hosts:
        # web-staging-01:
        #   ansible_host: 10.0.2.10
        #   ansible_user: admin
        # web-staging-02:
        #   ansible_host: 10.0.2.11
        #   ansible_user: admin
      vars:
        # Environment-specific vars overridden in group_vars/all.yml
        environment: staging
        tier: web

    # Database tier
    databases:
      hosts:
        # db-staging-01:
        #   ansible_host: 10.0.3.10
        #   ansible_user: admin
      vars:
        environment: staging
        tier: database

    # Monitoring / observability
    monitoring:
      hosts:
        # monitor-staging-01:
        #   ansible_host: 10.0.4.10
        #   ansible_user: admin
      vars:
        environment: staging
        tier: monitoring

    # Load balancers (if separate from web tier)
    loadbalancers:
      hosts: {}
      vars:
        environment: staging
        tier: loadbalancer

  # Global vars for all staging hosts (can be overridden in group_vars/all.yml)
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_become: yes
    ansible_become_method: sudo