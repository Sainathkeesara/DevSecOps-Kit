# last_verified: 2026-10-15 · ansible 2.15+
---
# Production inventory — generated from Terraform outputs or edited manually
# Host IPs/DNS should be populated by your CI/CD pipeline after Terraform apply
# See ansible-013 for the inventory generator script

all:
  children:
    # Control plane / management hosts
    bastion:
      hosts:
        # bastion-prod:
        #   ansible_host: 10.1.1.10
        #   ansible_user: admin
      vars:
        ansible_ssh_common_args: "-o ProxyCommand='ssh -W %h:%p -q admin@bastion-prod'"

    # Application tier
    webservers:
      hosts:
        # web-prod-01:
        #   ansible_host: 10.1.2.10
        #   ansible_user: admin
        # web-prod-02:
        #   ansible_host: 10.1.2.11
        #   ansible_user: admin
        # web-prod-03:
        #   ansible_host: 10.1.2.12
        #   ansible_user: admin
      vars:
        environment: production
        tier: web

    # Database tier
    databases:
      hosts:
        # db-prod-01:
        #   ansible_host: 10.1.3.10
        #   ansible_user: admin
        # db-prod-02:
        #   ansible_host: 10.1.3.11
        #   ansible_user: admin
      vars:
        environment: production
        tier: database

    # Monitoring / observability
    monitoring:
      hosts:
        # monitor-prod-01:
        #   ansible_host: 10.1.4.10
        #   ansible_user: admin
        # monitor-prod-02:
        #   ansible_host: 10.1.4.11
        #   ansible_user: admin
      vars:
        environment: production
        tier: monitoring

    # Load balancers
    loadbalancers:
      hosts:
        # lb-prod-01:
        #   ansible_host: 10.1.5.10
        #   ansible_user: admin
      vars:
        environment: production
        tier: loadbalancer

  # Global vars for all production hosts (can be overridden in group_vars/all.yml)
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_become: yes
    ansible_become_method: sudo