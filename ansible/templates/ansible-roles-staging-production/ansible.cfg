# last_verified: 2026-10-15 · ansible 2.15+
[defaults]
# Project-local roles take precedence over system/global roles
roles_path = ./roles:~/.ansible/roles:/usr/share/ansible/roles

# Inventory is explicit via -i flag; this is a fallback
inventory = ./inventories/staging

# Disable host key checking for ephemeral environments (override in production via env var)
host_key_checking = False

# Use the YAML callback for cleaner output
stdout_callback = yaml

# Show task args in output for debugging
display_args_to_stdout = True

# Enable fact caching to speed up subsequent runs
fact_caching = jsonfile
fact_caching_connection = .ansible_facts
fact_caching_timeout = 86400

# Disable gathering facts by default; roles that need it can set gather_facts: yes
gathering = explicit

# Timeout for SSH connections (seconds)
timeout = 30

# Forks for parallel execution (adjust for host count)
forks = 20

# Retry files location
retry_files_enabled = True
retry_files_save_path = .ansible_retry

# Vault password file (optional; prefer env var ANSIBLE_VAULT_PASSWORD_FILE)
# vault_password_file = .vault_pass

[ssh_connection]
# Reuse SSH connections (ControlPersist)
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
control_path = %(directory)s/%%h-%%r

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[galaxy]
# Role/collection download location
roles_path = ./roles:~/.ansible/roles:/usr/share/ansible/roles
collections_paths = ./collections:~/.ansible/collections:/usr/share/ansible/collections